name: Chartink Mind27 Everyday Call Options Alerts

on:
  # Allow manual trigger and external webhook trigger via cron-job.org
  workflow_dispatch:

jobs:
  run-alerts:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache-dependency-path: ''

      - name: Run Mind27 Call Options Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python screener_alert_mind27_call_options.py

      - name: Commit & Push Performance Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f strategy_performance.csv ]; then
            git add strategy_performance.csv
            if ! git diff --quiet || ! git diff --staged --quiet; then
              git commit -m "chore: update strategy performance report"
              for i in {1..5}; do
                git pull --rebase origin main && git push origin main && break
                echo "Conflict or push failed, retrying in 5 seconds..."
                sleep 5
              done
            fi
          fi
