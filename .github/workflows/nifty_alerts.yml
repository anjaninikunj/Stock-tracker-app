name: Nifty F&O Market Profile Alerts

on:
  # Allow manual trigger and cron trigger from cron-job.org
  workflow_dispatch:

jobs:
  run-alerts:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jugaad-data requests scipy numpy

      - name: Run Nifty Analysis Script
        env:
          NIFTY_TELEGRAM_BOT_TOKEN: ${{ secrets.NIFTY_TELEGRAM_BOT_TOKEN }}
          NIFTY_TELEGRAM_CHAT_ID: ${{ secrets.NIFTY_TELEGRAM_CHAT_ID }}
        run: python run_collection.py

      - name: Commit & Push New Snapshot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: add new Nifty market profile snapshot"
            for i in {1..5}; do
              git pull --rebase origin main && git push origin main && break
              echo "Conflict or push failed, retrying in 5 seconds..."
              sleep 5
            done
          fi
